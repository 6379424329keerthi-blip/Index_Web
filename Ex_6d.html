<!DOCTYPE html>
<html>

<head>
    <title>Moving Car - URK24CS1154</title>
</head>

<body>

    <h1>Moving Car</h1>

    <img src="car.png"
        id="img"
        width="150">

    <br><br>

    <button onclick="moveRight()">Move</button>

    <button onclick="stop()">Stop</button>

    <script>

        var imgObj;
        var animate;

        function init() {

            imgObj = document.getElementById("img");

            imgObj.style.position = "relative";
            imgObj.style.left = "0px";

        }

        function moveRight() {

            imgObj.style.left =
                parseInt(imgObj.style.left) + 1 + "px";

            animate = setTimeout(moveRight, 20);

        }

        function stop() {

            clearTimeout(animate);

        }

        window.onload = init;

    </script>

</body>

</html>
