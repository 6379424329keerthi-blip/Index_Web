<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML5 Forms and Media</title>

    <style>
        body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    width:950px;
    margin:auto;
    background:#fff;
    padding:15px;
    border:1px solid #ccc;
}

/* Header */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header img{
    width:120px;
    height:120px;
}

header h1{
    flex:1;
    text-align:center;
    font-family:"Times New Roman";
}

/* Navigation */

nav{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #ccc;
    border-bottom:1px solid #ccc;
    padding:8px;
}


nav a{
    margin-right:40px;
    text-decoration:none;
}

/* Skills and Video */

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    margin-top:20px;
}

.skill{
    margin:8px 0;
}

.bar{
    width:150px;
    height:12px;
    background:#ddd;
}

.fill{
    height:12px;
    background:#7ed957;
}

.video{
    text-align:right;
}

/* Forms */

.forms{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

fieldset{
    padding:10px;
}

label{
    display:inline-block;
    width:120px;
}

textarea{
    width:180px;
    height:60px;
}

/* Bottom */

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

iframe{
    width:100%;
    height:280px;
    border:1px solid #999;
}

/* Footer */

footer{
    margin-top:15px;
    border-top:1px solid #ccc;
    padding-top:10px;
}
    </style>
</head>

<body>
<div class="container">

<header>
    <img src="passport img.png" alt="photo">
    <h1>Mr. John Doe</h1>
</header>

<nav>
    <div>
        <a href="#">Academics</a>
        <a href="#">Achievements</a>
        <a href="#">Friends</a>
    </div>
    <input type="text" placeholder="search">
</nav>

<div class="main">

    <div>
        <div class="skill">
            Photoshop
            <div class="bar">
                <div class="fill" style="width:45%"></div>
            </div>
        </div>

        <div class="skill">
            Java
            <div class="bar">
                <div class="fill" style="width:35%"></div>
            </div>
        </div>

        <div class="skill">
            C++
            <div class="bar">
                <div class="fill" style="width:20%"></div>
            </div>
        </div>

        <div class="skill">
            PHP
            <div class="bar">
                <div class="fill" style="width:25%"></div>
            </div>
        </div>

        <div class="skill">
            JavaScript
            <div class="bar">
                <div class="fill" style="width:15%"></div>
            </div>
        </div>
    </div>

    <div class="video">

        <video controls width="320">
            <source src="./sd.mp4" type="video/mp4">
        </video>

    </div>
</div>

<div class="forms">
<fieldset>
<legend>Personal Information</legend>
<p>
<label>User name:</label>
<input type="text">
</p>
<p>
<label>Password:</label>
<input type="password">
</p>
<p>
<label>Reg No:</label>
<input type="text" value="UR15CS001">
</p>
<p>
<label>Age:</label>
<select>
<option>19-24</option>
</select>
</p>
<p>
<label>Gender:</label>
<input type="radio">Male
<input type="radio">Female
</p>
<p>
<label>DOB:</label>
<input type="date">
</p>
<p>
<label>Favorite Color:</label>
<input type="color">
</p>
<p>
<label>Photo:</label>
<input type="file">
</p>
</fieldset>
<fieldset>
<legend>Contact Information</legend>
<p>
<label>Address:</label>
<textarea></textarea>
</p>
<p>
<label>State:</label>
<select>
<option>Select</option>
<option>Tamil Nadu</option>
</select>
</p>
<p>
<label>Zipcode:</label>
<input type="text">
</p>
<p>
<label>Mobile:</label>
<input type="tel">
</p>
<p>
<label>Email:</label>
<input type="email">
</p>
<p>
<label>URL:</label>
<input type="url">
</p>
<p>
<input type="checkbox">
I verified
</p>
<input type="submit">
</fieldset>
</div>
<div class="bottom">
<iframe src="https://www.wikipedia.org"></iframe>
<iframe src="https://www.google.com/maps?q=Karunya%20Institute%20of%20Technology%20and%20Sciences,Coimbatore&output=embed"></iframe>
</div>
<footer>
<p>Your address</p>
<p>
&copy; 2020-2021 (Register number) - Web Technology Lab Batch 1. All Rights Reserved.
</p>
</footer>
</div>
</body>
</html>
